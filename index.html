<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World - Student ERP (Single Sheet 500 Records)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-container">
    <div class="button-wrapper">
      <button id="helloBtn" class="hello-button" type="button">
        Hello World
      </button>
      <p class="hint-text">Click the button to view the 500 Student ERP Sheet</p>
    </div>

    <section id="erpSection" class="erp-wrapper hidden" aria-hidden="true">
      <div class="excel-card">
        <!-- Excel Title Bar -->
        <div class="excel-titlebar">
          <div class="excel-brand">
            <span class="excel-icon">X</span>
            <span class="excel-title">Student_ERP_Master_List_500.xlsx — Excel</span>
          </div>
          <div class="excel-actions">
            <button id="filterToggleBtn" class="btn-filter" type="button" title="Open Filter Options">
              ⚡ Filter
            </button>
            <button id="exportBtn" class="btn-export" type="button" title="Download as CSV / Excel">
              📥 Export CSV
            </button>
            <div class="window-controls">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>

        <!-- Filter Panel -->
        <div id="filterPanel" class="filter-panel">
          <div class="filter-title">
            <span>Filter Criteria:</span>
          </div>
          <div class="filter-inputs">
            <div class="filter-field">
              <label for="filterRollNo">Roll No</label>
              <input type="text" id="filterRollNo" placeholder="e.g. 24CS, 005..." />
            </div>
            <div class="filter-field">
              <label for="filterName">Name</label>
              <input type="text" id="filterName" placeholder="e.g. Aarav, Sharma..." />
            </div>
            <div class="filter-field">
              <label for="filterDepartment">Department</label>
              <select id="filterDepartment">
                <option value="">All Departments</option>
                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                <option value="Information Technology">Information Technology</option>
                <option value="Electronics & Communication">Electronics & Communication</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Electrical & Electronics">Electrical & Electronics</option>
              </select>
            </div>
            <div class="filter-actions">
              <button id="resetFilterBtn" class="btn-reset-filter" type="button" title="Clear all filters">
                Clear Filters
              </button>
            </div>
          </div>
        </div>

        <!-- Excel Formula Bar -->
        <div class="excel-bar">
          <div class="cell-address">A1</div>
          <div class="fx-label">fx</div>
          <input type="text" id="searchInput" class="formula-input" placeholder="Quick search any keyword across the sheet..." />
        </div>

        <!-- Single Sheet Table Container -->
        <div class="table-scroll">
          <table class="excel-table">
            <thead>
              <tr class="col-headers">
                <th class="corner-header"></th>
                <th>A</th>
                <th>B</th>
                <th>C</th>
                <th>D</th>
                <th>E</th>
              </tr>
              <tr class="data-headers">
                <th class="row-num">1</th>
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Department</th>
                <th>Semester</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="studentTableBody">
              <!-- All 500 rows rendered via script.js -->
            </tbody>
          </table>
        </div>

        <!-- Excel Sheet Footer -->
        <div class="excel-footer">
          <div class="sheet-tabs">
            <button class="sheet-tab active" type="button">Sheet1 (500 Students)</button>
            <button class="sheet-tab" type="button">+</button>
          </div>
          <div class="footer-stats" id="recordCount">Ready | 500 students loaded</div>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
